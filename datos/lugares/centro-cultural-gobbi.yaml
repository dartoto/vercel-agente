descripcion_larga: "El Espacio Cultural Gobbi, ubicado en Paysandú, ocupa el antiguo\
  \ edificio donde funcionó durante décadas el Cine Astor.  El recinto fue remodelado\
  \ y reinaugurado por la Intendencia de Paysandú el 16 de octubre de 2019 como un\
  \ multi espacio cultural. \n\nLa iniciativa busca rendir homenaje y memoria al excepcional\
  \ artista sanducero Alfredo Eusebio Gobbi.  La magnífica sala ha sido adaptada para\
  \ acoger diversas disciplinas artísticas, incluyendo teatro, danza y espectáculos\
  \ culturales."
