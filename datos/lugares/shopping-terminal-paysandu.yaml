descripcion_corta: Terminal de ómnibus y principal Centro Comercial de Paysandú. Incluye
  supermercado, casas de cambio, cajeros automáticos y locales de gastronomía.
descripcion_larga: 'El Paysandú Shopping Terminal fue inaugurado el 13 de octubre
  de 2016.  El corte de cinta se realizó ese jueves, y al día siguiente (viernes 14)
  abrió oficialmente sus puertas al público.Es un centro comercial integrado a la
  terminal de ómnibus, diseñado como un punto de encuentro para viajeros y locales.  Sus
  características principales incluyen:


  Comercios: Ofrece una variedad de tiendas de moda (femenina, masculina e infantil)
  y artículos de marca. También cuenta con un supermercado y opciones gastronómicas.

  Instalaciones: Dispone de un amplio estacionamiento y patios de comidas.  Algunos
  usuarios destacan la limpieza y la distribución prolija de los locales.'
