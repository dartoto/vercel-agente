id: rincon-leandro-gomez
nombre: Rincón de Leandro Gómez
categoria: historico
descripcion_corta: Sitio donde fue fusilado el general Leandro Gómez tras la Defensa de Paysandú.
descripcion_larga: >
  Ubicado en el centro de Paysandú, este rincón conmemora uno de los episodios
  más trágicos y emblemáticos de la historia uruguaya. Leandro Gómez, defensor
  de la ciudad durante el sitio de 1864-1865, fue ejecutado aquí tras la caída
  de Paysandú.
historia: >
  Durante la Guerra del Uruguay, Paysandú resistió un sitio de 33 días contra
  las fuerzas de Venancio Flores y el Imperio del Brasil. La caída de la ciudad
  marcó un punto de inflexión en la historia regional.
